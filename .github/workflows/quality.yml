name: JoshHack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests, Static Analysis, and Mutation Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit regression tests
        run: ./mvnw -B test

      - name: Run SpotBugs analysis
        run: ./mvnw -B test-compile spotbugs:spotbugs

      - name: Run PIT mutation testing
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload SpotBugs SARIF to GitHub Code Scanning
        if: always() && hashFiles('target/spotbugsSarif.json') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/